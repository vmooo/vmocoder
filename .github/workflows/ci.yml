name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit pytest pip-audit

    - name: Lint with flake8
      run: |
        flake8 server.py --max-line-length=120 --count --show-source --statistics

    - name: Build Docker image
      run: |
        docker build -t vmocoder .
        docker images 

    - name: Run container test
      run: |
        docker run -d -p 8080:8080 --name test-app vmocoder
        sleep 2
        curl -s http://localhost:8080/ | grep "Hello, World!" || exit 1
        docker stop test-app && docker rm test-app

    - name: Run tests with pytest
      run: | 
        python -m pytest tests/ -v

    - name: Security scan with bandit
      run: |
        bandit -r . -f sarif -o bandit-results.sarif --exit-zero
    
    - name: Check dependencies with pip-audit
      run: |
        pip-audit --requirement requirements.txt --format markdown > pip-audit.md || true

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t my-encoder .
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'my-encoder'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'